<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 24px; color: #111; background: #fff; }
  header { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; margin-bottom: 16px; }
  input { font: inherit; padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; width: 20em; }
  code { background: #f3f3f3; padding: 1px 5px; border-radius: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border: 1px solid #eee; border-radius: 8px; cursor: pointer; background: none; font: inherit; color: inherit; }
  .tile:hover { border-color: #999; }
  .tile img { width: 24px; height: 24px; }
  .tile span { font-size: 11px; color: #555; word-break: break-all; text-align: center; }
  .tile.house span::after { content: ' ·'; color: #2563eb; }
  .hidden { display: none; }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #111; } .tile { border-color: #333; } .tile img { filter: invert(1); } code { background: #222; } }
</style>

<script>
  const base = new URL('icons/', location.href).href;
  for (const tile of document.querySelectorAll('.tile')) tile.addEventListener('click', async () => {
    const url = base + tile.dataset.name + '.svg';
    try { await navigator.clipboard.writeText(url); tile.querySelector('span').textContent = 'copied'; setTimeout(() => (tile.querySelector('span').textContent = tile.dataset.name), 800); } catch { prompt('URL', url); }
  });
  document.querySelector('input').addEventListener('input', (e) => {
    const words = e.target.value.toLowerCase().split(/\s+/).filter(Boolean);
    for (const tile of document.querySelectorAll('.tile')) {
      const hay = tile.dataset.name + ' ' + tile.dataset.tags;
      tile.classList.toggle('hidden', !words.every((w) => hay.includes(w)));
    }
  });
</script>
